name: Release (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # --- Required ---
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      # --- Recommended (have fallbacks but should be set) ---
      APP_NAME: ${{ secrets.APP_NAME }}
      VITE_CENTRIFUGO_URL: ${{ secrets.VITE_CENTRIFUGO_URL }}
      # --- Optional ---
      VITE_FEATURE_ASK_AI: ${{ secrets.VITE_FEATURE_ASK_AI }}
      VITE_BLACK_TAB_PIN: ${{ secrets.VITE_BLACK_TAB_PIN }}
      VITE_DEFAULT_CUSTOMER_NAME: ${{ secrets.VITE_DEFAULT_CUSTOMER_NAME }}
      VITE_DEFAULT_CUSTOMER_PHONE: ${{ secrets.VITE_DEFAULT_CUSTOMER_PHONE }}
      ERP_CLIENT_APP_UPDATE_KEY: ${{ secrets.ERP_CLIENT_APP_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check if release is needed
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // "v0.0.0"')
          LATEST_VERSION="${LATEST_TAG#v}"

          echo "tag=v${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "pkg_version=${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "latest_version=${LATEST_VERSION}" >> $GITHUB_OUTPUT

          SHOULD_RELEASE=$(PKG_VERSION="$PKG_VERSION" LATEST_VERSION="$LATEST_VERSION" node -e "
            const semver = v => v.replace(/^v/, '').split('.').map(Number);
            const [a, b] = [semver(process.env.PKG_VERSION), semver(process.env.LATEST_VERSION)];
            const gt = a[0] > b[0] || (a[0] === b[0] && (a[1] > b[1] || (a[1] === b[1] && a[2] > b[2])));
            console.log(gt ? 'true' : 'false');
          ")
          echo "should_release=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT

          if [ "$SHOULD_RELEASE" = "false" ]; then
            echo "::notice::v${PKG_VERSION} matches latest release v${LATEST_VERSION} — skipping release"
          else
            echo "::notice::v${PKG_VERSION} > latest release v${LATEST_VERSION} — proceeding with release"
          fi

      - name: Verify required build secrets
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: |
          for v in VITE_CLERK_PUBLISHABLE_KEY VITE_API_BASE_URL; do
            [ -n "${!v}" ] || { echo "$v is empty — add it under Settings > Secrets > Actions"; exit 1; }
          done

      - uses: actions/cache@v4
        if: steps.check.outputs.should_release == 'true'
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.check.outputs.should_release == 'true'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.should_release == 'true'
        run: npx vitest run

      - name: Build
        if: steps.check.outputs.should_release == 'true'
        run: npm run build

      - name: Guard bundle (no dev auth bypass)
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: |
          if grep -rEl "VITE_DEV_BYPASS_AUTH" dist/renderer; then
            echo "Dev bypass flag found in bundle"; exit 1
          fi

      - name: Package app
        if: steps.check.outputs.should_release == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: Create and push tag
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"

      - name: Create draft release
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" \
            --draft \
            --title "${{ steps.check.outputs.tag }}" \
            --notes "Automated release from ${{ github.sha }}"

      - name: Upload build to draft release
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.check.outputs.tag }}" \
            --clobber \
            release/*.exe \
            release/*.blockmap \
            release/latest.yml

      - name: Publish release
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.check.outputs.tag }}" --draft=false

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.should_release == 'true'
        with:
          name: windows-installer-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
